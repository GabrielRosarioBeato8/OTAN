name: Update OTAN rankings

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otan-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public rankings
        env:
          GGE_GAME: e4k
          GGE_SERVER: EmpirefourkingdomsExGG_2
          GGE_API_URL: ${{ vars.E4K_API_URL }}
          GGE_ALLIANCE: OTAN
          GGE_EVENTS: 40,44,46
        run: python scripts/update_rankings.py
      - name: Commit verified results
        run: |
          if git diff --quiet -- data/rankings.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json
          git commit -m "Update verified OTAN rankings"
          git push
